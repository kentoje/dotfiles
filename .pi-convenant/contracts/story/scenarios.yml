- id: ST-SHOW-01
  action: show
  status: planned
  given: Story button--primary exists with dark theme.
  when: Render at 800x600.
  then: Capture that iframe/theme/viewport and return the exact ID and evidence paths.
  obligations: *id001
- id: ST-SHOW-02
  action: show
  status: planned
  given: A selector matches two stories or requests an unsupported theme.
  when: Render.
  then: Reject before opening an unrelated page.
  obligations: *id001
- id: ST-SHOW-03
  action: show
  status: planned
  given: Render fails after browser context creation.
  when: Render.
  then: Close the owned context and retain failure artifacts.
  obligations: *id001
