schema_version: 1
component:
  id: worktree
  name: worktree
  status: draft
intent: ./intent.md
obligations:
- id: WORKTREE-001
  status: draft
  severity: high
  kind: invariant
  description: Worktree creation must constrain the new path to the configured worktree
    root and reject unsafe task paths.
  verification: []
  preconditions: []
  postconditions: []
  enforcement: null
  applicability: null
- id: WORKTREE-002
  status: draft
  severity: high
  kind: invariant
  description: Worktree setup must use the selected repository-owned setup mechanism
    when one is configured and report setup failures.
  verification: []
  preconditions: []
  postconditions: []
  enforcement: null
  applicability: null
- id: WORKTREE-003
  status: draft
  severity: high
  kind: invariant
  description: Worktree readiness must describe the requested worktree without automatically
    running a universal repository verification suite.
  verification: []
  preconditions: []
  postconditions: []
  enforcement: null
  applicability: null
- id: WORKTREE-004
  status: draft
  severity: high
  kind: invariant
  description: Worktree listing must distinguish registered task worktrees within
    the selected configured root.
  verification: []
  preconditions: []
  postconditions: []
  enforcement: null
  applicability: null
- id: WORKTREE-005
  status: draft
  severity: high
  kind: invariant
  description: Worktree removal must refuse unrelated paths and must not discard uncommitted
    changes through an implicit force operation.
  verification: []
  preconditions: []
  postconditions: []
  enforcement: null
  applicability: null
- id: WORKTREE-006
  status: draft
  severity: high
  kind: invariant
  description: Worktree creation must return an existing matching registered task
    worktree without repeating setup, or report an explicit conflict.
  verification: []
  preconditions: []
  postconditions: []
  enforcement: null
  applicability: null
- id: WORKTREE-007
  status: draft
  severity: high
  kind: invariant
  description: A setup failure after worktree creation must retain and identify the
    created path and branch as partial completion.
  verification: []
  preconditions: []
  postconditions: []
  enforcement: null
  applicability: null
- id: WORKTREE-008
  status: draft
  severity: high
  kind: invariant
  description: Worktree operations must not fetch, reset, clean or change another
    checkout implicitly.
  verification: []
  preconditions: []
  postconditions: []
  enforcement: null
  applicability: null
- id: WORKTREE-009
  status: draft
  severity: high
  kind: invariant
  description: Removal must identify untracked files, uncommitted changes and ahead
    commits before destructive removal.
  verification: []
  preconditions: []
  postconditions: []
  enforcement: null
  applicability: null
- id: WORKTREE-010
  status: draft
  severity: high
  kind: invariant
  description: Worktree cancellation must terminate owned setup work without deleting
    preexisting or concurrently modified user state.
  verification: []
  preconditions: []
  postconditions: []
  enforcement: null
  applicability: null
