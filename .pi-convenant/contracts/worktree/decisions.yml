schema_version: 1
decisions:
- id: worktree-worktree-root
  status: specified-default
  decision: Use project worktree root, then PI_WORKTREE_ROOT, then ~/.pi/worktrees; namespace paths by repository
    ID and task.
  drivers:
  - Supports relocated homes and prevents cross-repository task-name collisions.
  alternatives:
  - option: 'A fixed /Users/kento path: rejected.'
    disposition: rejected
  evidence:
  - Authored design rationale; not user-approved execution evidence
  related_obligations: &id001
  - WORKTREE-001
  - WORKTREE-002
  - WORKTREE-003
  - WORKTREE-004
  - WORKTREE-005
  - WORKTREE-006
  - WORKTREE-007
  - WORKTREE-008
  - WORKTREE-009
  - WORKTREE-010
  assumptions:
  - Service permissions and project conventions must be discovered at invocation.
  revisit_when:
  - The user changes scope or implementation reveals incompatible service/project behavior.
  approved_by: null
  execution_evidence: []
- id: worktree-preserve-partial-setup
  status: specified-default
  decision: Retain a successfully created checkout when later setup fails; report it as setup_failed.
  drivers:
  - The user can inspect/recover it, and it may already contain useful changes.
  alternatives:
  - option: 'Deleting the whole path on every setup failure: rejected.'
    disposition: rejected
  evidence:
  - Authored design rationale; not user-approved execution evidence
  related_obligations: *id001
  assumptions:
  - Service permissions and project conventions must be discovered at invocation.
  revisit_when:
  - The user changes scope or implementation reveals incompatible service/project behavior.
  approved_by: null
  execution_evidence: []
