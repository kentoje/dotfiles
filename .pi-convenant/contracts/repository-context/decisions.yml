- id: repository-context-context-precedence
  status: specified-default
  decision: Explicit invocation context overrides project declaration and trusted host configuration; session
    cwd is the final path default.
  drivers:
  - Makes task selection predictable.
  alternatives:
  - option: 'Choose another repository based on a convenient package name: rejected.'
    disposition: rejected
  evidence:
  - Authored design rationale; not user-approved execution evidence
  related_obligations: &id001
