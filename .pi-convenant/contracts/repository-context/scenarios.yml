schema_version: 1
status: planned-not-executed
scenarios:
- id: RC-ROOT-01
  action: resolve
  status: planned
  given: The same project is moved under another home directory.
  when: Resolve.
  then: Use the new selected root rather than a hard-coded developer path.
  obligations: &id001
  - REPOSITORYCONTEXT-001
  - REPOSITORYCONTEXT-002
  - REPOSITORYCONTEXT-003
  - REPOSITORYCONTEXT-004
  - REPOSITORYCONTEXT-005
  - REPOSITORYCONTEXT-006
- id: RC-NONGIT-02
  action: resolve
  status: planned
  given: A directory has scripts but no Git repository.
  when: Resolve for project CLI discovery.
  then: Return usable project facts and null Git fields.
  obligations: *id001
- id: RC-BAD-03
  action: resolve
  status: planned
  given: Project config names a conflicting repository.
  when: Resolve.
  then: Report conflict with sources; do not guess which target to mutate.
  obligations: *id001
- id: REPOSITORYCONTEXT-001-ACCEPTANCE
  status: planned
  given: A controlled fixture satisfying the applicable preconditions, plus an adversarial fixture violating
    the boundary.
  when: Repository context must identify the selected repository and worktree rather than rely on a fixed developer-home
    path.
  then: Observe the required behavior and prove the forbidden side effect did not occur; retain target identities
    and effects in diagnostics.
  obligations:
  - REPOSITORYCONTEXT-001
  test_design_note: Derive an executable assertion from this obligation and the concrete action examples before
    activation; this record is not an executable test.
