schema_version: 1
decisions:
- id: retrospective-explicit-retrospective
  status: accepted-user
  decision: Run only when the operator invokes a retrospective.
  drivers:
  - The user rejected automatic blocked-completion continuations.
  alternatives:
  - option: 'Run on every settlement: rejected.'
    disposition: rejected
  evidence:
  - Explicit user conversation decision
  related_obligations: &id001
  - RETROSPECTIVE-001
  - RETROSPECTIVE-002
  - RETROSPECTIVE-003
  - RETROSPECTIVE-004
  - RETROSPECTIVE-005
  assumptions:
  - Service permissions and project conventions must be discovered at invocation.
  revisit_when:
  - The user changes scope or implementation reveals incompatible service/project behavior.
  approved_by: user (conversation scope only)
  execution_evidence: []
- id: retrospective-backlog-proposals
  status: specified-default
  decision: Record draft improvements in harness docs/backlog.md with stable HBR IDs, evidence and proposed
    behavior.
  drivers:
  - Keeps repeated reflection useful and traceable.
  alternatives:
  - option: 'Generate implementation or require pseudo-test syntax: rejected.'
    disposition: rejected
  evidence:
  - Authored design rationale; not user-approved execution evidence
  related_obligations: *id001
  assumptions:
  - Service permissions and project conventions must be discovered at invocation.
  revisit_when:
  - The user changes scope or implementation reveals incompatible service/project behavior.
  approved_by: null
  execution_evidence: []
