schema_version: 1
decisions:
- id: project-cli-tailored-capabilities
  status: accepted-user
  decision: Discover and agree capabilities per project; existing E2E is one possible capability.
  drivers:
  - Different projects operate differently.
  alternatives:
  - option: 'Always add browser/E2E machinery: rejected.'
    disposition: rejected
  - option: 'Always expose exactly types/lint/test: rejected.'
    disposition: rejected
  evidence:
  - Explicit user conversation decision
  related_obligations: &id001
  - PROJECTCLI-001
  - PROJECTCLI-002
  - PROJECTCLI-003
  - PROJECTCLI-004
  - PROJECTCLI-005
  - PROJECTCLI-006
  - PROJECTCLI-007
  - PROJECTCLI-008
  - PROJECTCLI-009
  - PROJECTCLI-010
  - PROJECTCLI-011
  - PROJECTCLI-012
  - PROJECTCLI-013
  - PROJECTCLI-014
  - PROJECTCLI-015
  - PROJECTCLI-016
  - PROJECTCLI-017
  - PROJECTCLI-018
  assumptions:
  - Service permissions and project conventions must be discovered at invocation.
  revisit_when:
  - The user changes scope or implementation reveals incompatible service/project behavior.
  approved_by: user (conversation scope only)
  execution_evidence: []
- id: project-cli-propose-before-create
  status: accepted-user
  decision: The agent can propose; writing needs an accepted proposal or explicit creation request.
  drivers:
  - A useful suggestion must not mutate a project on its own.
  alternatives:
  - option: 'Generate silently on first project encounter: rejected.'
    disposition: rejected
  evidence:
  - Explicit user conversation decision
  related_obligations: *id001
  assumptions:
  - Service permissions and project conventions must be discovered at invocation.
  revisit_when:
  - The user changes scope or implementation reveals incompatible service/project behavior.
  approved_by: user (conversation scope only)
  execution_evidence: []
- id: project-cli-owned-artifacts
  status: specified-default
  decision: Default manifest .project-cli/manifest.json; default entrypoint bin/project, with an explicitly
    chosen existing/project-native alternative allowed.
  drivers:
  - Gives discoverability without mandating an implementation language.
  alternatives:
  - option: 'Global user-home-only generated CLI: rejected.'
    disposition: rejected
  evidence:
  - Authored design rationale; not user-approved execution evidence
  related_obligations: *id001
  assumptions:
  - Service permissions and project conventions must be discovered at invocation.
  revisit_when:
  - The user changes scope or implementation reveals incompatible service/project behavior.
  approved_by: null
  execution_evidence: []
- id: project-cli-usable-versus-passing
  status: specified-default
  decision: A CLI can faithfully report failed product checks; capability usability and project check outcome
    are independent.
  drivers:
  - Correct failure reporting is part of a useful CLI.
  alternatives:
  - option: 'Rewrite expectations or product code so maintenance can report pass: rejected.'
    disposition: rejected
  evidence:
  - Authored design rationale; not user-approved execution evidence
  related_obligations: *id001
  assumptions:
  - Service permissions and project conventions must be discovered at invocation.
  revisit_when:
  - The user changes scope or implementation reveals incompatible service/project behavior.
  approved_by: null
  execution_evidence: []
