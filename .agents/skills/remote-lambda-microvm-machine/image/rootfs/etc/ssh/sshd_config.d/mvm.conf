# Dev MicroVM sshd. Reached only through the WebSocket bridge on port 2222 (see
# mvm-hook-server), which Lambda exposes behind the MicroVM endpoint's auth token.
ListenAddress 127.0.0.1
AllowUsers dev
PermitRootLogin no
PasswordAuthentication no
# The only keys accepted are the laptop keys registered in S3 right now, read at every login, so
# `mvm keys remove` revokes a laptop on running machines too. No authorized_keys file is read.
# sshd requires the script and its directories to be root-owned.
AuthorizedKeysFile none
AuthorizedKeysCommand /opt/mvm/bin/mvm-authorized-keys %u
AuthorizedKeysCommandUser dev
KbdInteractiveAuthentication no
# No PAM inside the container: there is no logind, and the dev account has no password.
UsePAM no
AcceptEnv LANG LC_* COLORTERM TERM_PROGRAM
ClientAliveInterval 30
ClientAliveCountMax 4
AllowTcpForwarding yes
AllowStreamLocalForwarding yes
X11Forwarding no
