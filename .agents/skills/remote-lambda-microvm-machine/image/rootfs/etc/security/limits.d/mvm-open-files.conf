# Open files limit for PAM sessions on the machine (runuser, su).
# mvm-on-run starts the workspace bootstrap with `runuser -u dev`, and the suspend and terminate
# hooks save WIP branches the same way. PAM's pam_limits sets every limit this file does not name
# from PID 1's (tini: Lambda's 1024), which undid mvm-hook-server's raise: pnpm install in the
# bootstrap then failed with EMFILE and every new machine ended "degraded".
# Keep in step with OPEN_FILES_LIMIT in /opt/mvm/bin/mvm-hook-server (mvm_hook_server_test.py checks it).
*     soft  nofile  1048576
*     hard  nofile  1048576
root  soft  nofile  1048576
root  hard  nofile  1048576
