# TUIOS Configuration File
# This file allows you to customize appearance and keybindings
#
# Configuration location: /Users/kento/.config/tuios/config.toml
# Documentation: https://github.com/Gaurav-Gosain/tuios
# For keybindings documentation, run: tuios keybinds list
#
# tuios watches this file. A save takes effect at once, with no restart.
# tuios does not apply a file that has an error. It keeps the settings that
# are in use and shows the error on screen.

# ============================================================================
# APPEARANCE SETTINGS
# ============================================================================
# Many of these can be changed live from the in-app settings page
# (open it with the leader key followed by ',').
#
# border_style: rounded, normal, thick, double, hidden, block, ascii,
#               outer-half-block, inner-half-block
# dockbar_position: bottom, top, hidden
# window_title_position: bottom, top, hidden
# window_button_style: pill, dots (macOS traffic lights)
# window_button_position: right, left. Independent of the style; dots and
#               left is the shipped pair, the macOS arrangement
# theme: color theme name (e.g. dracula, nord); empty for terminal colors
# click_to_type: single (a click on a pane starts typing in it), double
#               (two clicks do), off (a click only focuses)
# auto_enter_terminal_on_focus: off (Tab keeps cycling windows),
#               targeted (numbered select and arrows start typing),
#               all (every covered focus command, including Tab)
# [appearance.scrollbar]: style = thin, track; thumb/track = a one-cell glyph
#               (track also takes "none"); tint = border, muted, #RRGGBB
# background: off (your terminal shows through), theme (the theme's
#               background), or #RRGGBB, for every surface at once
# pane_background, desktop_background, window_chrome_background,
#               dock_background, [appearance.sidebar] background: the same
#               values for one surface; empty follows background, and a
#               colour a program or the chrome chose always wins
# ============================================================================

# ============================================================================
# KEYBINDINGS
# ============================================================================
# Set an action to [] to unbind it and hand the key back to the shell.
# An empty list and a missing line are not the same thing. A line this file
# does not have gets its default back the next time tuios starts; an action
# set to [] stays empty.
#
# You do not have to edit this by hand. In tuios, open the keybind manager
# (leader then k, or the command palette) and press ctrl+d on a binding to
# remove it, or ctrl+x to take its key off every action. From a shell:
#
#   tuios keybinds unbind close_window w   # one key off one action
#   tuios keybinds free alt+left           # off every action
#
# `tuios keybinds doctor` says which binding in each scope is live, what
# clashes with what, and which keys never reach the program in the pane.
#
# [keybindings.global] acts in window mode and terminal mode alike. It binds
# ctrl+p to the command palette and alt+space to the launcher, which costs
# you fish's history-back and readline's set-mark. To move or drop either:
#
#   [keybindings.global]
#   command_palette = ["ctrl+shift+p"]
#   launcher = []
#
# [keybindings.terminal_mode] binds alt+arrows to move focus between panes.
# In readline, fish and zsh, alt+left and alt+right move the cursor a word
# at a time. If you want those back:
#
#   [keybindings.terminal_mode]
#   terminal_focus_left = []
#   terminal_focus_right = []
#
# alt+up and alt+down are unclaimed by the common shells, so they are the
# safer pair to keep.
#
# shift+pgup and shift+pgdown scroll one page. middle pastes from the host
# clipboard. Write ctrl+middle to add a modifier.
#
# hold_window_mode binds a key that puts tuios in window-management mode for
# as long as it is physically held, and hands the previous mode back when it
# is let go:
#
#   [keybindings.mode_control]
#   hold_window_mode = ["leftalt"]
#
# It needs a terminal that speaks the Kitty keyboard protocol (Ghostty, kitty,
# WezTerm, foot, Alacritty; not Terminal.app), because nothing else reports
# that a key was released. Naming a modifier key (leftalt, rightalt, leftctrl,
# leftsuper) asks the terminal for one more thing on top: every keystroke in
# the session then arrives as an escape code. Any ordinary key (f13 to f63,
# scrolllock, a spare letter) avoids that. Unbound by default.
# ============================================================================

# ============================================================================
# DOCK COMPONENTS
# ============================================================================
# The dock is three ordered lists of component names. Leave [dock] out
# entirely and the bar draws what it always drew; write the lists to
# reorder it, and omit a name to drop that segment.
#
#   [dock]
#   left   = ["mode", "workspaces", "trail", "tape"]
#   center = ["windows"]
#   right  = ["notifications", "copy-help", "cpu", "ram", "clock", "session-controls"]
#
# A cell of your own is a command whose first line of stdout is the text:
#
#   [dock.custom.branch]
#   command = "git branch --show-current"
#   refresh = "event:after-focus-change"   # or once, push, or "30s"
#
# and then "custom/branch" in one of the lists above. A component that
# fails is hidden rather than left showing a stale value;
# `tuios list-dock-components` says which and why.
# ============================================================================

[startup]
tiled = true
daemon = true
# herdr has no window mode: land in the pane, typing.
start_in_terminal_mode = true

[daemon]
# After a daemon restart (tuios restart-server, a crash, a reboot), relaunch
# each pane's agent on its own conversation, from the session id the harness
# hooks report. "ask" puts a Resume item in the Inbox instead.
resume_agents = "auto"

[appearance]
# Same palette as Ghostty, nvim and btop. themes/melange-dark.json came from
# `tuios import-theme` on Ghostty's built-in "Melange Dark".
theme = "melange-dark"
# A click puts you straight in the pane, as in herdr. Keyboard focus moves
# (h/j/k/l in window mode) keep window mode: auto_enter_terminal_on_focus
# stays at its default, off.
click_to_type = "single"
# No traffic-light dots (minimize, zoom, close) on each pane's title bar.
hide_window_buttons = true
# Pane borders in the herdr look: melange green on the focused pane (herdr's
# accent), quiet melange grey elsewhere, one line between neighbours.
border_focused_color = "#85B695"
border_unfocused_color = "#403A36"
shared_borders = false
# border_style = "hidden"
window_title_position = "hidden" # optional, removes the title row too
# Titles as plain text on the border: pill, tab or plain.
window_title_style = "plain"
# Neovim announces itself over OSC 7777, so ctrl+h/j/k/l reach it and it hands
# focus back to tuios at a split edge.
nvim_navigation = true
motion = "none"

[appearance.sidebar]
# The default rail minus the files section (oil and yazi do files better) and
# the terminals section (Cmd+g reaches every pane).
sections = "sessions:60,agents:40"

[spotlight]
enabled = false

# ============================================================================
# HERDR-PARITY KEYMAP
# ============================================================================
# Concepts: a herdr workspace is a tuios session, a herdr tab is a tuios
# workspace, a herdr pane is a tuios window.
#
# Two layers, the same as .config/herdr/config.toml:
#   1. Ghostty's Cmd layer (.config/ghostty/config) forwards Cmd+<key> as
#      ctrl+a then <key>. The tmux preset already answers most of those bytes
#      (c, 1-9, %, ", z, [), and [keybindings.prefix_mode] below fixes the rest.
#   2. Keys Ghostty leaves alone (Cmd+h/j/k/l/e/r) reach tuios directly
#      through the Kitty keyboard protocol and live in [keybindings.global].
#
#   Cmd key        ghostty sends   herdr action          tuios action
#   Cmd+t          prefix c        new_tab               new_workspace
#   Cmd+1..9       prefix 1..9     switch_tab            switch_workspace_N
#   Cmd+d          prefix %        split_vertical        prefix_split_vertical
#   Cmd+Shift+d    prefix "        split_horizontal      prefix_split_horizontal
#   Cmd+f          prefix z        zoom                  prefix_fullscreen
#   Cmd+s          prefix [ 0      copy mode             prefix_selection
#   Cmd+g          prefix j        goto                  choose_tree
#   Cmd+Shift+g    direct          -                     prefix_inbox
#   Cmd+i          direct          -                     prefix_review
#   Cmd+Shift+i    direct          -                     lazygit scratch (command key)
#   Cmd+a          prefix k        -                     prefix_inbox
#   Cmd+p          direct          -                     command_palette
#   (prefix p)     prefix p        fd|fzf file picker    command key below
#   Cmd+o          prefix o        fzf URL picker        command key below
#   Cmd+n          prefix N        new_workspace         new_session
#   Cmd+Shift+b    prefix B        toggle_sidebar        prefix_toggle_sidebar
#   Cmd+h / Cmd+l  direct          previous/next_tab     prev/next_workspace
#   Cmd+k / Cmd+j  direct          previous/next_workspace  prev/next_session
#   Cmd+e          direct          next_agent            command key below
#   Cmd+Shift+e    direct          previous_agent        command key below
#   Cmd+r          direct          rename_tab            rename_workspace
#   Cmd+Shift+r    direct          rename_workspace      rename_session
#   ctrl+h/j/k/l   direct          vim-herdr-navigation  terminal_focus_* + nvim_navigation
# ============================================================================

[keybindings]
leader_key = "ctrl+a"
preset = "tmux"

[keybindings.global]
# Cmd+p: the palette (Ghostty no longer forwards Cmd+p). ctrl+p goes back to
# fish and the agent TUIs; prefix P still opens the palette too.
command_palette = ["super+p"]
prev_workspace = ["super+h"]
next_workspace = ["super+l"]
prev_session = ["super+k"]
next_session = ["super+j"]
# Cmd+e / Cmd+Shift+e cycle every agent pane: command keys below. The tuios
# jumps stay on the prefix: ctrl+t o for the agent waiting on you, O for the
# newest finished turn.
rename_workspace = ["super+r"]
rename_session = ["super+shift+r"]
# Cmd+g: herdr goto, every pane of every session. Ghostty forwards Cmd+g as
# prefix j (see prefix_mode); super+g covers a Ghostty without that forward.
choose_tree = ["super+g"]
# Cmd+Shift+g: the agent Inbox, as Cmd+a and prefix k / i.
prefix_inbox = ["super+shift+g"]
# Cmd+i: review (inspect) the focused pane's changes and send the agent notes. prefix v too.
prefix_review = ["super+i"]

[keybindings.terminal_mode]
# ctrl+h/j/k/l move between panes, and through Neovim splits first (see
# appearance.nvim_navigation and .config/nvim/lua/kentoje/tuios-pane-navigation.lua).
# This replaces herdr's vim-herdr-navigation plugin: tuios 0.10.1 has no
# plugin_action command keys. alt+arrows go back to fish.
terminal_focus_left = ["ctrl+h"]
terminal_focus_down = ["ctrl+j"]
terminal_focus_up = ["ctrl+k"]
terminal_focus_right = ["ctrl+l"]
# alt+n / alt+p belong to the shell too; opt+tab still cycles windows.
terminal_next_window = ["opt+tab"]
terminal_prev_window = ["opt+shift+tab"]

[keybindings.lists]
# ctrl+j/ctrl+k move in the command palette and every other list, as in fzf.
# The defaults stay: j/k only work in a list with no filter to type into.
list_down = ["down", "ctrl+n", "j", "ctrl+j"]
list_up = ["up", "ctrl+p", "k", "ctrl+k"]

[keybindings.prefix_mode]
# Cmd+g (prefix j): herdr goto. The preset's f and / still work.
choose_tree = ["j", "f", "/"]
prefix_workspace_switcher = ["w"]
prefix_jump_notif = ["J"]
# Cmd+a (prefix k): the agent Inbox.
prefix_inbox = ["k", "i"]
prefix_keybinds = ["K"]
# Cmd+p and Cmd+o (prefix p, prefix o) are command keys below.
prev_workspace = []
prefix_next_window = []
# Cmd+n (prefix N): herdr new_workspace.
new_session = ["N"]
prefix_last_message = []
# Cmd+Shift+b (prefix B): herdr toggle_sidebar.
prefix_toggle_sidebar = ["B", "b"]
prefix_toggle_spotlight = []
# herdr keys typed by hand. prefix q detaches here too: the preset's q
# (display_panes) moves to Q, and quit (kills the session) is nowhere near it.
prefix_detach = ["q", "d"]
display_panes = ["Q"]
prefix_settings = ["s", "C"]
prefix_session_switcher = ["S"]
# prefix x closes every pane of the workspace, after a dialog. The preset's & too.
close_workspace = ["x", "&"]
# prefix X closes the whole session with its panes: a command key below, so
# the client moves to another session instead of detaching.
prefix_close_session = []
# Closing one pane moves off x: prefix alt+x, or x / w in window mode.
prefix_close_window = ["alt+x"]
# prefix r is the resize mode command key below.
reload_config = []

# Cmd+Shift+i: lazygit in a floating scratch terminal over the layout, next to
# Cmd+i review. The key shows and hides it; lazygit keeps running while hidden.
[[keybindings.command]]
key = "super+shift+i"
type = "scratch"
command = "lazygit"
description = "Lazygit"
width = "80%"
height = "80%"

# prefix r: herdr's resize mode. h/j/k/l move the focused pane's border by 5%,
# H/J/K/L by 15%, until Esc, q, Enter or r. Takes r from reload_config: the
# config reloads on save, and the palette still has "Reload config".
[[keybindings.command]]
key = "prefix+r"
type = "popup"
description = "Resize mode"
command = "$HOME/.config/tuios/scripts/resize-pane-mode.sh"
width = "40"
height = "4"

# prefix X: after a confirmation, close this session and land in the most
# recently used other one. The built-in prefix_close_session neither asks nor
# switches: the client detaches.
[[keybindings.command]]
key = "prefix+X"
type = "popup"
description = "Close session, switch to the last one"
command = "$HOME/.config/tuios/scripts/close-session-and-switch.sh"
width = "60"
height = "8"

# Cmd+e / Cmd+Shift+e: herdr next_agent / previous_agent, every agent pane in
# every session, whatever its state.
[[keybindings.command]]
key = "super+e"
type = "shell"
description = "Focus the next agent pane"
command = "$HOME/.config/tuios/scripts/cycle-agent-pane-focus.sh next"

[[keybindings.command]]
key = "super+shift+e"
type = "shell"
description = "Focus the previous agent pane"
command = "$HOME/.config/tuios/scripts/cycle-agent-pane-focus.sh prev"

# prefix p: fuzzy file path, typed into the focused pane without a newline.
[[keybindings.command]]
key = "prefix+p"
type = "popup"
description = "Fuzzy file path into the focused pane"
command = 'sel=$(fd --type f --absolute-path --hidden | fzf) && [ -n "$sel" ] && tuios send-text -w "$TUIOS_ACTIVE_PANE_ID" "$sel"'
width = "80%"
height = "80%"

# Cmd+o: pick URLs from the focused pane and open them in the browser.
# Shared with herdr: the script reads the pane through whichever one runs it.
[[keybindings.command]]
key = "prefix+o"
type = "popup"
description = "Open URLs from the focused pane"
command = '''fish --no-config -c 'source $HOME/.config/herdr/scripts/fzf-url.fish' '''
width = "80%"
height = "80%"

# prefix G: herdr new_worktree. A branch name, then a session on a fresh
# worktree of the focused pane's repository, then switch to it.
[[keybindings.command]]
key = "prefix+G"
type = "popup"
description = "New worktree session"
command = '''printf 'New worktree branch: '; read -r branch; [ -n "$branch" ] || exit 0; top=$(git rev-parse --show-toplevel) || { printf 'Not in a git repository. Press enter'; read -r _; exit 1; }; repo=$(basename "$top"); name="$repo-$(printf %s "$branch" | tr / -)"; tuios worktree new "$branch" --name "$name" --detach && tuios switch-session "$name" || { printf 'Press enter'; read -r _; }'''
width = "60%"
height = "30%"

[hosts.omarchy]
addr = "omarchy.ts"
