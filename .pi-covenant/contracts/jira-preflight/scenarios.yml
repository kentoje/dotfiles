schema_version: 1
status: planned-not-executed
scenarios:
  - id: JP-MATCH-01
    action: check_creation
    status: planned
    given: Existing CI-123 summary differs only by case/whitespace.
    when: Check creation.
    then: Return exact match and duplicate_decision_required.
    obligations: &id001
      - JIRAPREFLIGHT-001
      - JIRAPREFLIGHT-002
      - JIRAPREFLIGHT-003
      - JIRAPREFLIGHT-004
      - JIRAPREFLIGHT-005
  - id: JP-DENY-02
    action: check_creation
    status: planned
    given: User declines creation after seeing that match.
    when: Resume create caller.
    then: No create request is sent.
    obligations: *id001
  - id: JP-CHANGE-03
    action: check_creation
    status: planned
    given: Project/summary changes after a duplicate decision.
    when: Check again.
    then: Do not reuse the old decision.
    obligations: *id001
  - id: JP-FAIL-04
    action: check_creation
    status: planned
    given: Search fails or is incomplete.
    when: Check creation.
    then: Return blocked, never proceed based on apparent absence.
    obligations: *id001
