schema_version: 1
status: planned-not-executed
scenarios:
  - id: SH-READY-01
    action: run
    status: planned
    given: Task branch has authorized changes and no MR; project checks pass.
    when: Invoke /ship.
    then: Commit task changes, push, create one draft MR, address review, wait for required CI on the final head and mark ready; do not merge.
    obligations: &id001
      - SHIPPING-001
      - SHIPPING-002
      - SHIPPING-003
      - SHIPPING-004
      - SHIPPING-005
      - SHIPPING-006
      - SHIPPING-007
      - SHIPPING-008
      - SHIPPING-009
      - SHIPPING-010
      - SHIPPING-011
  - id: SH-REUSE-02
    action: run
    status: planned
    given: The branch already has MR !42.
    when: Invoke /ship.
    then: Update !42; do not create !43 merely because more commits were added.
    obligations: *id001
  - id: SH-HEAD-03
    action: run
    status: planned
    given: CI is green for A; a review fix pushes B.
    when: Continue shipping.
    then: Invalidate A readiness and require observations for B.
    obligations: *id001
  - id: SH-BLOCK-04
    action: run
    status: planned
    given: A required human decision or the deadline blocks progress.
    when: Ship.
    then: Return blockers and completed effects; no automatic new agent turn.
    obligations: *id001
  - id: SH-OWNERSHIP-05
    action: run
    status: planned
    given: A tracked file contains unrelated user changes.
    when: Ship without clear staging scope.
    then: Do not stage those changes implicitly; request the necessary scope decision.
    obligations: *id001
  - id: SH-CANCEL-06
    action: run
    status: planned
    given: A commit and push completed before cancellation while waiting for CI.
    when: Cancel command.
    then: Return those completed IDs, stop local waiting and leave remote CI running unless separately asked to cancel it.
    obligations: *id001
  - id: SHIPPING-001-ACCEPTANCE
    status: planned
    given: A controlled fixture satisfying the applicable preconditions, plus an adversarial fixture violating the boundary.
    when: Completing an ordinary coding task must not require creating or updating a merge request.
    then: Observe the required behavior and prove the forbidden side effect did not occur; retain target identities and effects in diagnostics.
    obligations:
      - SHIPPING-001
    test_design_note: Derive an executable assertion from this obligation and the concrete action examples before activation; this record is not an executable test.
  - id: SHIPPING-002-ACCEPTANCE
    status: planned
    given: A controlled fixture satisfying the applicable preconditions, plus an adversarial fixture violating the boundary.
    when: Shipping actions must occur only within an explicit user request to ship.
    then: Observe the required behavior and prove the forbidden side effect did not occur; retain target identities and effects in diagnostics.
    obligations:
      - SHIPPING-002
    test_design_note: Derive an executable assertion from this obligation and the concrete action examples before activation; this record is not an executable test.
