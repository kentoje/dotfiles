schema_version: 1
status: planned-not-executed
scenarios:
  - id: FL-STATUS-01
    action: status
    status: planned
    given: Repo A is clean, repo B is dirty and has no comparison ref.
    when: Read both.
    then: Return both identities; B has unknown counts and an explicit missing basis.
    obligations: &id001
      - FLEET-001
      - FLEET-002
      - FLEET-003
      - FLEET-004
      - FLEET-005
      - FLEET-006
      - FLEET-007
      - FLEET-008
  - id: FL-STATUS-02
    action: status
    status: planned
    given: B GitLab lookup fails while its local Git read succeeds.
    when: Read status.
    then: Keep B local facts and mark partial; do not assert no MR.
    obligations: *id001
  - id: FL-STATUS-03
    action: status
    status: planned
    given: Selection contains an unknown ID.
    when: Read fleet.
    then: Return invalid selection before silently adding all repositories.
    obligations: *id001
  - id: FL-VER-01
    action: versions
    status: planned
    given: A declares ui as ^2.3.0, B declares workspace:*, C has no declaration.
    when: Compare ui.
    then: Return those exact specs with path/section and explicit missing for C.
    obligations: *id001
  - id: FL-VER-02
    action: versions
    status: planned
    given: B package.json is malformed.
    when: Compare versions.
    then: B is error, not missing; A and C remain available.
    obligations: *id001
  - id: FL-VER-03
    action: versions
    status: planned
    given: Two workspaces declare different versions.
    when: Compare a package.
    then: Return both declarations rather than choosing one.
    obligations: *id001
  - id: FLEET-001-ACCEPTANCE
    status: planned
    given: A controlled fixture satisfying the applicable preconditions, plus an adversarial fixture violating the boundary.
    when: Fleet v1 exposes repository status across the selected repositories.
    then: Observe the required behavior and prove the forbidden side effect did not occur; retain target identities and effects in diagnostics.
    obligations:
      - FLEET-001
    test_design_note: Derive an executable assertion from this obligation and the concrete action examples before activation; this record is not an executable test.
