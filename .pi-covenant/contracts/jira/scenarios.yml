schema_version: 1
status: planned-not-executed
scenarios:
  - id: JI-GET-01
    action: get
    status: planned
    given: Two sites contain the same issue key.
    when: Get the key from selected site A.
    then: Return A only, with site context.
    obligations: &id001
      - JIRA-001
      - JIRA-002
      - JIRA-003
      - JIRA-004
      - JIRA-005
      - JIRA-006
      - JIRA-007
      - JIRA-008
      - JIRA-009
      - JIRA-010
      - JIRA-011
      - JIRA-012
  - id: JI-GET-02
    action: get
    status: planned
    given: Issue cannot be read.
    when: Get issue.
    then: Return an actionable read error, not an empty invented issue.
    obligations: *id001
  - id: JI-SEARCH-01
    action: search
    status: planned
    given: A valid query has no visible matches.
    when: Search.
    then: Return ok with an empty complete page.
    obligations: *id001
  - id: JI-SEARCH-02
    action: search
    status: planned
    given: Search is unavailable.
    when: Search.
    then: Return error, not the same empty result.
    obligations: *id001
  - id: JI-SEARCH-03
    action: search
    status: planned
    given: Results span two pages.
    when: Read first page.
    then: Return continuation and complete=false.
    obligations: *id001
  - id: JI-CREATE-01
    action: create
    status: planned
    given: Required custom field Sprint is missing.
    when: Create issue.
    then: Return field guidance without sending a create request.
    obligations: *id001
  - id: JI-CREATE-02
    action: create
    status: planned
    given: An exact normalized summary match exists.
    when: Create without duplicate decision.
    then: Return blocked with candidates and no mutation.
    obligations: *id001
  - id: JI-CREATE-03
    action: create
    status: planned
    given: Server creates the issue but the client loses the response.
    when: Create.
    then: Return indeterminate and do not automatically create a second issue.
    obligations: *id001
  - id: JI-UPDATE-01
    action: update
    status: planned
    given: Summary and labels already exist.
    when: Update summary only.
    then: Labels remain unchanged and response identifies summary as the changed field.
    obligations: *id001
  - id: JI-UPDATE-02
    action: update
    status: planned
    given: Provider acknowledges update; following read fails.
    when: Update.
    then: Return partial with acknowledged mutation; no automatic repeat.
    obligations: *id001
  - id: JI-COMMENT-01
    action: comment
    status: planned
    given: Two issues exist.
    when: Comment on CI-123.
    then: Only CI-123 receives the requested body and returned comment ID.
    obligations: *id001
  - id: JI-COMMENT-02
    action: comment
    status: planned
    given: Posting times out after dispatch.
    when: Comment.
    then: Return indeterminate; no second comment appears from automatic retry.
    obligations: *id001
  - id: JI-TRANS-01
    action: transition
    status: planned
    given: Two available transitions share a name.
    when: Transition by name.
    then: Return choices without mutation.
    obligations: *id001
  - id: JI-TRANS-02
    action: transition
    status: planned
    given: A selected transition requires a resolution field.
    when: Omit that field.
    then: Return FIELD_REQUIRED before the mutation.
    obligations: *id001
  - id: JI-TRANS-03
    action: transition
    status: planned
    given: The transition succeeds but refresh fails.
    when: Transition.
    then: Return partial with the acknowledged transition ID, not a fabricated final state.
    obligations: *id001
  - id: JIRA-001-ACCEPTANCE
    status: planned
    given: A controlled fixture satisfying the applicable preconditions, plus an adversarial fixture violating the boundary.
    when: Jira reads must retain the identity of the requested issue or search results.
    then: Observe the required behavior and prove the forbidden side effect did not occur; retain target identities and effects in diagnostics.
    obligations:
      - JIRA-001
    test_design_note: Derive an executable assertion from this obligation and the concrete action examples before activation; this record is not an executable test.
