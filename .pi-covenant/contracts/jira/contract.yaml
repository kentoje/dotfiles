schema_version: 1
component:
  id: jira
  name: jira
  status: active
intent: ./intent.md
obligations:
  - id: JIRA-001
    status: active
    severity: high
    kind: invariant
    description: Jira reads must retain the identity of the requested issue or search results.
    verification:
      - jira-001-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: JIRA-002
    status: active
    severity: high
    kind: invariant
    description: Jira lookup failures must not be presented as an empty successful search or a nonexistent issue.
    verification:
      - jira-002-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: JIRA-003
    status: active
    severity: high
    kind: invariant
    description: Jira mutation must apply only the fields or operation authorized by the task request.
    verification:
      - jira-003-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: JIRA-004
    status: active
    severity: high
    kind: invariant
    description: Jira creation preflight must surface matching existing issues before a possible duplicate is created.
    verification:
      - jira-004-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: JIRA-005
    status: active
    severity: high
    kind: invariant
    description: A Jira mutation must report the resulting issue identity and must not report success for a failed remote operation.
    verification:
      - jira-005-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: JIRA-006
    status: active
    severity: high
    kind: invariant
    description: Jira search must preserve the selected site and project constraints, pagination and the exact submitted query semantics.
    verification:
      - jira-006-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: JIRA-007
    status: active
    severity: high
    kind: invariant
    description: Jira creation must validate required project, issue type and custom fields before the first mutation.
    verification:
      - jira-007-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: JIRA-008
    status: active
    severity: high
    kind: invariant
    description: Jira field names must resolve unambiguously to current field metadata or return an actionable field error.
    verification:
      - jira-008-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: JIRA-009
    status: active
    severity: high
    kind: invariant
    description: Jira update must reject an empty patch and must preserve fields absent from the requested patch.
    verification:
      - jira-009-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: JIRA-010
    status: active
    severity: high
    kind: invariant
    description: Jira comments must preserve the requested issue and body without silently posting an additional comment on uncertain retry.
    verification:
      - jira-010-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: JIRA-011
    status: active
    severity: high
    kind: invariant
    description: Jira transitions must use an available transition ID or an unambiguous available name for the current issue.
    verification:
      - jira-011-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: JIRA-012
    status: active
    severity: high
    kind: invariant
    description: A Jira mutation followed by a failed readback must distinguish the committed write from the unavailable resulting view.
    verification:
      - jira-012-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: JIRA-013
    status: active
    severity: high
    kind: invariant
    description: Jira create must continue a valid duplicate search beyond twenty pages and still require complete evidence within the configured bound.
    verification:
      - jira-013-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
sources:
  - models/jira/mutation/
  - src/jira/
dependencies:
  - tool-protocol
  - jira-preflight
interfaces:
  - name: jira-v1
    language: typescript
    module: architecture/modules/jira.json
    export: jira-v1
  - name: jira-runtime
    language: typescript
    module: src/jira/module-port.ts
    export: makeJiraModule
