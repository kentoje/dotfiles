schema_version: 1
status: planned-not-executed
scenarios:
  - id: WT-NEW-01
    action: new
    status: planned
    given: Task path contains ../escape.
    when: Create worktree.
    then: Reject before creating a branch or path.
    obligations: &id001
      - WORKTREE-001
      - WORKTREE-002
      - WORKTREE-003
      - WORKTREE-004
      - WORKTREE-005
      - WORKTREE-006
      - WORKTREE-007
      - WORKTREE-008
      - WORKTREE-009
      - WORKTREE-010
  - id: WT-NEW-02
    action: new
    status: planned
    given: Matching task worktree already exists.
    when: Create again.
    then: Return the same path; no second setup or branch.
    obligations: *id001
  - id: WT-NEW-03
    action: new
    status: planned
    given: Checkout creation succeeds; setup fails.
    when: Create.
    then: Return partial with the retained registered checkout and setup_failed.
    obligations: *id001
  - id: WT-NEW-04
    action: new
    status: planned
    given: Repository setup already creates its worktree.
    when: Create through that mechanism.
    then: Do not issue an additional native git worktree add.
    obligations: *id001
  - id: WT-VERIFY-01
    action: verify
    status: planned
    given: A worktree exists but a required setup artifact is absent.
    when: Verify it.
    then: Report the specific missing artifact without starting types/lint/tests.
    obligations: *id001
  - id: WT-VERIFY-02
    action: verify
    status: planned
    given: Another worktree is active in the session.
    when: Verify an explicit path.
    then: Inspect only the explicit path context.
    obligations: *id001
  - id: WT-LIST-01
    action: list
    status: planned
    given: Registered worktrees exist inside and outside the root.
    when: List.
    then: Return only contained managed task worktrees.
    obligations: *id001
  - id: WT-LIST-02
    action: list
    status: planned
    given: An unregistered folder exists in the root.
    when: List.
    then: Do not label it a managed Git worktree.
    obligations: *id001
  - id: WT-RM-01
    action: rm
    status: planned
    given: A worktree has untracked source.
    when: Remove.
    then: Refuse; preserve the file and checkout.
    obligations: *id001
  - id: WT-RM-02
    action: rm
    status: planned
    given: A clean worktree has an unpushed commit.
    when: Remove.
    then: Refuse and report the unique work.
    obligations: *id001
  - id: WT-RM-03
    action: rm
    status: planned
    given: A registered clean task checkout has no unique commits.
    when: Remove.
    then: Remove it through Git and retain its branch.
    obligations: *id001
