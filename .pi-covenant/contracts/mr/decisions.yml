schema_version: 1
decisions:
  - id: mr-existing-mr-tool
    status: specified-default
    decision: Keep status, threads, reply and update as the MR surface.
    drivers:
      - Separate existing-MR actions from the explicitly invoked ship workflow.
    alternatives:
      - option: "Creating an MR while reading status: rejected."
        disposition: rejected
    evidence:
      - Authored design rationale; not user-approved execution evidence
    related_obligations: &id001
      - MR-001
      - MR-002
      - MR-003
      - MR-004
      - MR-005
      - MR-006
      - MR-007
      - MR-008
      - MR-009
      - MR-010
      - MR-011
    assumptions:
      - Service permissions and project conventions must be discovered at invocation.
    revisit_when:
      - The user changes scope or implementation reveals incompatible service/project behavior.
    approved_by: null
    execution_evidence: []
  - id: mr-partial-reply
    status: specified-default
    decision: Post reply before optional resolution; preserve a committed reply ID if resolution fails.
    drivers:
      - This avoids losing the explanation or duplicating it on retry.
    alternatives:
      - option: "Retrying the entire compound action after a resolution error: rejected."
        disposition: rejected
    evidence:
      - Authored design rationale; not user-approved execution evidence
    related_obligations: *id001
    assumptions:
      - Service permissions and project conventions must be discovered at invocation.
    revisit_when:
      - The user changes scope or implementation reveals incompatible service/project behavior.
    approved_by: null
    execution_evidence: []
