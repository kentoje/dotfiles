schema_version: 1
component:
  id: mr-guard
  name: mr-guard
  status: active
intent: ./intent.md
obligations:
  - id: MRGUARD-001
    status: active
    severity: high
    kind: invariant
    description: An MR creation guard must check the effective target repository and source branch of the requested creation.
    verification:
      - mrguard-001-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: MRGUARD-002
    status: active
    severity: high
    kind: invariant
    description: An MR creation guard must surface an already existing matching MR before another MR is created.
    verification:
      - mrguard-002-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: MRGUARD-003
    status: active
    severity: high
    kind: invariant
    description: An MR creation guard must not require an MR at ordinary task completion or enqueue an automatic continuation when creation is blocked.
    verification:
      - mrguard-003-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: MRGUARD-004
    status: active
    severity: high
    kind: invariant
    description: MR creation protection must distinguish zero, one and multiple existing branch MRs and treat lookup failure as unresolved protection.
    verification:
      - mrguard-004-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: MRGUARD-005
    status: active
    severity: high
    kind: invariant
    description: Repository-specific title and delivery checks must be enforced only when explicitly configured for the selected repository.
    verification:
      - mrguard-005-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: MRGUARD-006
    status: active
    severity: high
    kind: invariant
    description: The guard must declare which direct creation entrypoints it covers and must not claim to sandbox arbitrary shell programs.
    verification:
      - mrguard-006-acceptance
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
sources:
  - models/mr/guard/
  - src/mr-guard/
dependencies:
  - tool-protocol
  - repository-context
  - mr
interfaces:
  - name: mr-guard-v1
    language: typescript
    module: architecture/modules/mr-guard.json
    export: mr-guard-v1
  - name: mr-guard-runtime
    language: typescript
    module: src/mr-guard/module-port.ts
    export: makeMrCreationGuard
