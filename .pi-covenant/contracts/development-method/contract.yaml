schema_version: 1
component:
  id: development-method
  name: development-method
  status: draft
intent: ./intent.md
obligations:
  - id: DEVELOPMENTMETHOD-001
    status: draft
    severity: high
    kind: invariant
    description: Each implemented harness feature must have behavioral obligations and executable acceptance checks defined before its implementation is treated as complete.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: DEVELOPMENTMETHOD-002
    status: draft
    severity: high
    kind: invariant
    description: Starting or completing an ordinary product coding task must not require running Covenant against that product.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: DEVELOPMENTMETHOD-003
    status: draft
    severity: high
    kind: invariant
    description: The harness must not add a Covenant-based runtime completion or shipping gate by default.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: DEVELOPMENTMETHOD-004
    status: active
    severity: high
    kind: invariant
    description: Development contract validation must reject dependency cycles, undeclared or private module imports, inconsistent public schemas and missing acceptance fixtures.
    verification:
      - development-contract-consistency
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: DEVELOPMENTMETHOD-005
    status: active
    severity: high
    kind: invariant
    description: Required development commands must fail on nonzero exit, launch failure, cancellation or timeout while retaining bounded diagnostics.
    verification:
      - development-command-failures
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: DEVELOPMENTMETHOD-006
    status: active
    severity: high
    kind: invariant
    description: A complete local check must require all declared steps and current passing full-project Covenant evidence, and must reject missing, incomplete or scoped results.
    verification:
      - development-result-policy
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: DEVELOPMENTMETHOD-007
    status: active
    severity: high
    kind: invariant
    description: Fallow module boundary rules must match declared dependencies and reject forbidden imports without disabling dead-code checks.
    verification:
      - development-fallow-boundaries
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
sources:
  - src/development-method/
  - scripts/
dependencies: []
interfaces:
  - name: development-method-v1
    language: typescript
    module: architecture/modules/development-method.json
    export: development-method-v1
