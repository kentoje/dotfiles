schema_version: 1
component:
  id: gitlab
  name: gitlab
  status: draft
intent: ./intent.md
obligations:
  - id: GITLAB-001
    status: draft
    severity: high
    kind: invariant
    description: GitLab lookup must resolve its repository and source branch from the selected working context rather than an unrelated checkout.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: GITLAB-002
    status: draft
    severity: high
    kind: invariant
    description: GitLab lookup must distinguish an absent merge request from an unavailable or malformed lookup result.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: GITLAB-003
    status: draft
    severity: high
    kind: invariant
    description: GitLab lookup must not create, update, merge or delete remote resources.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: GITLAB-004
    status: draft
    severity: high
    kind: invariant
    description: The GitLab tool must expose repository and CI operations separately from MR discussion and metadata operations.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: GITLAB-005
    status: draft
    severity: high
    kind: invariant
    description: Pipeline and job reads must preserve pipeline ID, job ID, ref, SHA and retried-attempt identity where available.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: GITLAB-006
    status: draft
    severity: high
    kind: invariant
    description: Job log results must state the returned byte window, truncation and whether more bytes remain.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: GITLAB-007
    status: draft
    severity: high
    kind: invariant
    description: Pipeline retry must target an explicit repository and pipeline ID within an authorized request.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: GITLAB-008
    status: draft
    severity: high
    kind: invariant
    description: Pipeline cancellation must target an explicit pipeline and report observed state separately from request acceptance.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: GITLAB-009
    status: draft
    severity: high
    kind: invariant
    description: A pipeline with no retryable failed or canceled jobs must be reported as an unchanged retry outcome.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: GITLAB-010
    status: draft
    severity: high
    kind: invariant
    description: GitLab operations must not delete pipelines, play deployment jobs or create new pipelines in v1.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: GITLAB-011
    status: draft
    severity: high
    kind: invariant
    description: Pipeline job and merge-request collection evidence must retain query-bound pagination and must not infer absence or retry ineligibility from incomplete or failed reads.
    verification: []
  - id: GITLAB-012
    status: draft
    severity: high
    kind: invariant
    description: Each authorized pipeline mutation may be sent at most once per invocation; an unacknowledged dispatch must retain unknown effects and return indeterminate without an automatic replay.
    verification: []
  - id: GITLAB-013
    status: draft
    severity: high
    kind: invariant
    description: Cancellation or deadline expiry must prevent a new GitLab dispatch while preserving acknowledged or unknown effects of mutations already sent.
    verification: []
  - id: GITLAB-014
    status: draft
    severity: high
    kind: invariant
    description: Pipeline mutation authority must be supplied by the trusted host for the exact action host project and pipeline; tool arguments or changed targets must not grant or expand it.
    verification: []
  - id: GITLAB-015
    status: draft
    severity: high
    kind: invariant
    description: GitLab response and trace processing must enforce transport byte and time limits and expose incomplete output without interpreting a killed or oversized response as complete success.
    verification: []
  - id: GITLAB-016
    status: draft
    severity: high
    kind: invariant
    description: Conflicting retry and cancel operations on the same resolved pipeline must be rejected or serialized within the host coordinator before dispatch; independent resources must not share a global write lock.
    verification: []
  - id: GITLAB-017
    status: draft
    severity: high
    kind: invariant
    description: GitLab credentials and authentication headers must remain in the trusted host transport and configured redaction boundary rather than enter feature inputs outputs or diagnostic records.
    verification: []
sources:
  - models/gitlab/
dependencies:
  - tool-protocol
  - repository-context
interfaces:
  - name: gitlab-v1
    language: typescript
    module: architecture/modules/gitlab.json
    export: gitlab-v1
