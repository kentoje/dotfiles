schema_version: 1
status: planned-not-implemented
binding_policy: These are exact reserved Vitest IDs and planned files, not executable native verification bindings. Keep native obligations draft until real acceptance exists.
slices:
  - id: target-and-transport
    files:
      - src/gitlab/context/resolve.ts
      - src/gitlab/transport/decode.ts
      - src/foundation/gitlab/transport.ts
      - src/repository-context/resolution/gitlab-target.ts
    tests:
      - gitlab.context
      - gitlab.read-only
      - gitlab.authorization
      - gitlab.transport-bounds
      - gitlab.credential-boundary
  - id: repository-ci-reads
    files:
      - src/gitlab/repository/read.ts
      - src/gitlab/pipelines/read.ts
      - src/gitlab/jobs/read.ts
      - src/gitlab/pagination/cursor.ts
    tests:
      - gitlab.identities
      - gitlab.pagination
      - gitlab.forbidden-effects
  - id: logs-and-shared-mr-lookup
    files:
      - src/gitlab/logs/read.ts
      - src/gitlab/merge-requests/lookup.ts
    tests:
      - gitlab.logs
      - gitlab.mr-lookup
  - id: pipeline-mutations
    files:
      - src/gitlab/pipelines/retry.ts
      - src/gitlab/pipelines/cancel.ts
      - src/gitlab/invocation/mutation.ts
      - src/foundation/gitlab/coordination.ts
    tests:
      - gitlab.retry-target
      - gitlab.cancel
      - gitlab.retry-no-change
      - gitlab.uncertain-write
      - gitlab.cancellation
      - gitlab.coordination
  - id: pi-registration
    files:
      - src/gitlab/module-port.ts
      - src/foundation/registration/gitlab-tool.ts
    tests:
      - gitlab.surface
