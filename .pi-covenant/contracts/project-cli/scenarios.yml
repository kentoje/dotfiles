    action: inspect
    status: planned
    given: A service uses make test and a frontend uses pnpm test:e2e.
    when: Inspect both.
    then: Report their actual separate commands; no files or processes are created.
    obligations: &id001
      - PROJECTCLI-001
      - PROJECTCLI-002
      - PROJECTCLI-003
      - PROJECTCLI-004
      - PROJECTCLI-005
      - PROJECTCLI-006
      - PROJECTCLI-007
      - PROJECTCLI-008
      - PROJECTCLI-009
      - PROJECTCLI-010
      - PROJECTCLI-011
      - PROJECTCLI-012
      - PROJECTCLI-013
      - PROJECTCLI-014
      - PROJECTCLI-015
      - PROJECTCLI-016
      - PROJECTCLI-017
      - PROJECTCLI-018
  - id: PC-INSPECT-02
    action: inspect
    status: planned
    given: The project already has a suitable CLI.
    when: Inspect.
    then: Return it rather than proposing a redundant replacement by default.
    obligations: *id001
  - id: PC-PROP-01
    action: propose
    status: planned
    given: A library has tests and build but no E2E.
    when: Propose CLI.
    then: Offer supported library operations without adding browser infrastructure.
    obligations: *id001
  - id: PC-PROP-02
    action: propose
    status: planned
    given: A web project has E2E, but only build/lint were requested.
    when: Propose.
    then: Do not silently add E2E to the agreed scope.
    obligations: *id001
  - id: PC-PROP-03
    action: propose
    status: planned
    given: Proposal targets project A.
    when: Accept then change invocation to B.
    then: Acceptance does not authorize B without a new matched scope.
    obligations: *id001
  - id: PC-CREATE-01
    action: create
    status: planned
    given: Accepted scope contains types and an existing E2E script.
    when: Create and exercise.
    then: Only those capabilities are generated; E2E delegates to that script.
    obligations: *id001
  - id: PC-CREATE-02
    action: create
    status: planned
    given: An existing user-owned entrypoint conflicts.
    when: Create.
    then: Refuse implicit overwrite and preserve content.
    obligations: *id001
  - id: PC-CREATE-03
    action: create
    status: planned
    given: A command executes but product tests fail.
    when: Exercise.
    then: Report actual failed checks separately from CLI operation; do not rewrite product tests.
    obligations: *id001
  - id: PC-CREATE-04
    action: create
    status: planned
    given: A safe live prerequisite is absent.
    when: Create.
    then: Keep that capability unproven; do not claim all capabilities usable.
    obligations: *id001
  - id: PC-MAINT-01
    action: maintain
    status: planned
    given: An accepted test script was renamed.
    when: Maintain.
    then: Repair the owned invocation and exercise it; preserve the existing capability ID.
    obligations: *id001
  - id: PC-MAINT-02
    action: maintain
    status: planned
    given: A new E2E suite appears outside the accepted capability set.
    when: Maintain.
    then: Propose adding it without silently modifying scope.
    obligations: *id001
  - id: PC-MAINT-03
    action: maintain
    status: planned
    given: The CLI is correct and a real product journey regressed.
    when: Maintain.
    then: Report product regression; do not alter product code or weaken the feature map.
    obligations: *id001
  - id: PC-MAINT-04
    action: maintain
    status: planned
    given: Everything agrees and exercises correctly.
    when: Maintain.
    then: Return clean without a manufactured patch or MR.
    obligations: *id001
  - id: PROJECTCLI-001-ACCEPTANCE
    status: planned
    given: A controlled fixture satisfying the applicable preconditions, plus an adversarial fixture violating the boundary.
    when: The agent may inspect a project and propose creating a tailored CLI when no suitable project CLI exists.
    then: Observe the required behavior and prove the forbidden side effect did not occur; retain target identities and effects in diagnostics.
    obligations:
      - PROJECTCLI-001
    test_design_note: Derive an executable assertion from this obligation and the concrete action examples before activation; this record is not an executable test.
