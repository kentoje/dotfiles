schema_version: 1
component:
  id: project-cli
  name: project-cli
  status: active
intent: ./intent.md
obligations:
  - id: PROJECTCLI-001
    status: draft
    severity: high
    kind: invariant
    description: The agent may inspect a project and propose creating a tailored CLI when no suitable project CLI exists.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-002
    status: draft
    severity: high
    kind: invariant
    description: An unsolicited project CLI proposal must not create or modify project CLI files before the user accepts it.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-003
    status: draft
    severity: high
    kind: invariant
    description: CLI creation must resolve its capability set from the specific project and the agreed user choices.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-004
    status: draft
    severity: high
    kind: invariant
    description: A generated CLI must not add E2E or real-app interaction as a universal requirement.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-005
    status: draft
    severity: high
    kind: invariant
    description: When existing E2E is selected as a capability, the generated CLI invokes the project-owned E2E commands.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-006
    status: draft
    severity: high
    kind: invariant
    description: The generated CLI and its usage instructions must be owned by the target repository.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-007
    status: draft
    severity: high
    kind: invariant
    description: A newly created or repaired CLI capability must be exercised successfully before it is reported usable.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-008
    status: draft
    severity: high
    kind: invariant
    description: CLI maintenance must detect drift between the agreed capabilities and the current project commands or tooling.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-009
    status: draft
    severity: high
    kind: invariant
    description: CLI maintenance must propose additions or removals instead of silently changing the agreed capability set.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-010
    status: active
    severity: high
    kind: invariant
    description: Project CLI inspection and unsolicited proposals must not execute repository scripts or write project files.
    verification:
      - project-check-read-only
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-011
    status: draft
    severity: high
    kind: invariant
    description: An accepted project CLI proposal must identify the exact project and capability set before creation starts.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-012
    status: draft
    severity: high
    kind: invariant
    description: Project CLI creation must refuse to overwrite an existing CLI or user-edited artifact implicitly.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-013
    status: draft
    severity: high
    kind: invariant
    description: The generated manifest must describe each capability invocation, effect, prerequisites, result interpretation and cleanup.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-014
    status: active
    severity: high
    kind: invariant
    description: A project check failure must remain a project check failure even when the CLI transport and result parsing operate correctly.
    verification:
      - project-check-product-failure
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-015
    status: draft
    severity: high
    kind: invariant
    description: Maintenance must restrict repairs to CLI-owned artifacts and report product regressions separately.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-016
    status: draft
    severity: high
    kind: invariant
    description: Maintenance must preserve manually modified artifacts and require a reconciled patch rather than overwriting them from old generated state.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-017
    status: draft
    severity: high
    kind: invariant
    description: Project CLI execution proofs must retain artifacts after cleanup and identify unexercised capabilities honestly.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-018
    status: draft
    severity: high
    kind: invariant
    description: Project CLI maintenance must not commit, push or open an MR unless shipping is separately requested.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: PROJECTCLI-019
    status: active
    severity: high
    kind: invariant
    description: Discovery must prefer explicit project configuration or one existing aggregate check command before selecting available typecheck lint and test scripts without adding build or E2E implicitly.
    verification:
      - project-check-discovery
  - id: PROJECTCLI-020
    status: active
    severity: high
    kind: invariant
    description: The complete nonempty mandatory check plan must validate unique IDs command arguments contained working directories and finite positive timeouts before any command starts.
    verification:
      - project-check-configuration
  - id: PROJECTCLI-021
    status: active
    severity: high
    kind: invariant
    description: A project check run may pass only when every configured mandatory check completes successfully with exit zero and complete evidence.
    verification:
      - project-check-completion
  - id: PROJECTCLI-022
    status: active
    severity: high
    kind: invariant
    description: Failed unavailable timed-out or unexecuted mandatory checks must produce a nonzero overall outcome and must not be retried or silently omitted. Diagnostic output must stay bounded with truncation reported separately from command completion.
    verification:
      - project-check-failures
  - id: PROJECTCLI-023
    status: active
    severity: high
    kind: invariant
    description: Cancellation or deadline expiry must stop scheduling new checks and terminate owned child processes while preserving truthful completed and unexecuted results.
    verification:
      - project-check-cancellation
  - id: PROJECTCLI-024
    status: active
    severity: high
    kind: invariant
    description: The project check command must report its resolved project required check identities individual outcomes and a truthful overall exit code without repairing or shipping the project.
    verification:
      - project-check-cli
  - id: PROJECTCLI-025
    status: active
    severity: high
    kind: invariant
    description: Static discovery must inventory existing typechecking lint formatting unit E2E build and dead-code checks using script aliases and known commands and retain source evidence without executing or modifying the project.
    verification:
      - project-check-inventory
  - id: PROJECTCLI-026
    status: active
    severity: high
    kind: invariant
    description: An inferred local suite must include every discovered ordinary check category not demonstrably covered by selected safe aggregate commands while preserving an explicit configured suite exactly.
    verification:
      - project-check-coverage
  - id: PROJECTCLI-027
    status: active
    severity: high
    kind: invariant
    description: Inspection and run reports must show selected covered and available checks with reasons; detecting E2E or build must not universally add them to mandatory local execution.
    verification:
      - project-check-selection
  - id: PROJECTCLI-028
    status: active
    severity: high
    kind: invariant
    description: Discovery must recognize Knip as dead-code analysis and distinguish browser installation or code-generation helpers from actual E2E test commands without auto-running setup.
    verification:
      - project-check-check-tools
  - id: PROJECTCLI-029
    status: active
    severity: high
    kind: invariant
    description: Discovery must surface supported standalone check commands from local CI and repository instructions with provenance and literal argv while excluding unsafe shell context and preserving explicit suite precedence.
    verification:
      - project-check-standalone
  - id: PROJECTCLI-030
    status: active
    severity: high
    kind: invariant
    description: Optional keep-going execution must retain every failure while attempting later mandatory checks; it must never turn partial success into pass or schedule new commands after cancellation or global deadline expiry.
    verification:
      - project-check-keep-going
sources:
  - src/project-cli/
  - models/project-checks/
dependencies:
  - tool-protocol
  - repository-context
interfaces:
  - name: project-cli-v1
    language: typescript
    module: architecture/modules/project-cli.json
    export: project-cli-v1
  - name: project-check-runtime
    language: typescript
    module: src/project-cli/module-port.ts
    export: runProjectChecks
