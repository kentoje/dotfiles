schema_version: 1
component:
  id: foundation
  name: foundation
  status: draft
intent: ./intent.md
obligations:
  - id: FOUNDATION-001
    status: active
    severity: high
    kind: invariant
    description: The harness runs as extensions and configuration of standard Pi rather than replacing its standard interaction model.
    verification:
      - foundation.registration.FOUNDATION-001
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: FOUNDATION-002
    status: draft
    severity: high
    kind: invariant
    description: Harness implementation must not copy, import or depend on implementation code from /Users/kento/dotfiles/.pi-custom-harness.
    verification: []
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: FOUNDATION-003
    status: active
    severity: high
    kind: invariant
    description: The harness preserves standard Pi capabilities unless the user explicitly agrees to a capability change.
    verification:
      - foundation.registration.FOUNDATION-003
    preconditions: []
    postconditions: []
    enforcement: null
    applicability: null
  - id: FOUNDATION-004
    status: active
    severity: high
    kind: invariant
    description: Validate complete Pi tool arguments and resolve the selected project before dispatching an implemented module.
    verification:
      - foundation.boundary
  - id: FOUNDATION-005
    status: active
    severity: high
    kind: invariant
    description: A stopped or expired Pi invocation must not dispatch a module; in-flight module cancellation must retain its terminal failure and completed effects.
    verification:
      - foundation.lifecycle
  - id: FOUNDATION-006
    status: active
    severity: high
    kind: invariant
    description: Pi tool results must preserve module outcomes and structured details; failures and partial completion must never be rendered as success or trigger another turn.
    verification:
      - foundation.results
  - id: FOUNDATION-007
    status: active
    severity: high
    kind: invariant
    description: Worktree setup and locations must come from explicitly supplied bounded host configuration matched to the canonical repository; missing or malformed configuration must block worktree effects.
    verification:
      - foundation.configuration
sources:
  - src/foundation/
  - models/pi-invocation/
dependencies:
  - tool-protocol
  - repository-context
  - gitlab
  - jira
  - mr
  - mr-guard
  - worktree
  - fleet
  - project-cli
  - preview
  - story
  - retrospective
  - shipping
interfaces:
  - name: foundation-v1
    language: typescript
    module: architecture/modules/foundation.json
    export: foundation-v1
  - name: foundation-runtime
    language: typescript
    module: src/foundation/module-port.ts
    export: registerPiHarness
