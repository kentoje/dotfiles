models:
  - id: project-checks
    component: project-cli
    source: models/project-checks/Checks.tla
    configuration: models/project-checks/Checks.cfg
    modules: {}
    checker:
      backend: tla-ts
      version: 0.0.7
      timeout_seconds: 15
    bounds:
      max_states: 10000
      max_depth: 50
    assumptions:
      - Two required checks stand for the completion policy; arbitrary list size is exercised by implementation checks, not formally proved by this finite model.
      - Commands are trusted project code; the model represents reported completion outcomes, not correctness of the underlying repo or service.
      - Cancellation is observed at dispatch boundaries; in-flight effects are not rolled back. No liveness or scheduling fairness claim.
    bindings:
      - obligation: PROJECTCLI-014
        invariant: NoFalsePass
      - obligation: PROJECTCLI-021
        invariant: NoFalsePass
      - obligation: PROJECTCLI-022
        invariant: NoFalsePass
      - obligation: PROJECTCLI-023
        invariant: NoDispatchAfterCancel
    conformance:
      - obligation: PROJECTCLI-014
        action: Finalize
        observation: passed
        binding: project-check-product-failure
      - obligation: PROJECTCLI-021
        action: Finalize
        observation: passed
        binding: project-check-completion
      - obligation: PROJECTCLI-022
        action: Complete
        observation: states
        binding: project-check-failures
      - obligation: PROJECTCLI-023
        action: Cancel
        observation: cancelled
        binding: project-check-cancellation
    faults:
      - id: premature-success
        source: models/project-checks/ChecksPremature.tla
        invariant: NoFalsePass
      - id: dispatch-after-cancel
        source: models/project-checks/ChecksCancel.tla
        invariant: NoDispatchAfterCancel
  - id: check-selection
    component: project-cli
    source: models/project-checks/Selection.tla
    configuration: models/project-checks/Selection.cfg
    modules: {}
    checker:
      backend: tla-ts
      version: 0.0.7
      timeout_seconds: 15
    bounds:
      max_states: 10000
      max_depth: 10
    assumptions:
      - Three categories represent two ordinary checks and E2E; this finite model is not a proof over arbitrary inventories.
      - Available and aggregate-covered categories abstract trusted static analysis; parser adequacy and command behavior are verified with executable tests.
      - Explicit configuration is project-owned selection. E2E can be included by it or by an existing selected aggregate, not merely by detection.
    bindings:
      - obligation: PROJECTCLI-026
        invariant: NoOmittedLocal
      - obligation: PROJECTCLI-026
        invariant: ExplicitWins
      - obligation: PROJECTCLI-027
        invariant: NoImplicitE2E
    conformance:
      - obligation: PROJECTCLI-026
        action: Select
        observation: selected
        binding: project-check-coverage
      - obligation: PROJECTCLI-027
        action: Select
        observation: selected
        binding: project-check-selection
    faults:
      - id: aggregate-hides-checks
        source: models/project-checks/SelectionOmission.tla
        invariant: NoOmittedLocal
      - id: universal-e2e
        source: models/project-checks/SelectionE2E.tla
        invariant: NoImplicitE2E
      - id: override-explicit-plan
        source: models/project-checks/SelectionOverride.tla
        invariant: ExplicitWins
  - id: check-modes
    component: project-cli
    source: models/project-checks/Modes.tla
    configuration: models/project-checks/Modes.cfg
    modules: {}
    checker:
      backend: tla-ts
      version: 0.0.7
      timeout_seconds: 15
    bounds:
      max_states: 10000
      max_depth: 50
    assumptions:
      - Two required checks and finite terminal outcomes represent fail-fast versus keep-going; arbitrary lists need executable tests, not a formal generalization claim.
      - Cancellation and absolute deadline expiry are abstracted by a stop event; per-check timeout remains a terminal failed outcome.
      - Only resolved validated command plans enter execution; commands are trusted project code and effects are not rolled back.
    bindings:
      - obligation: PROJECTCLI-030
        invariant: TruthfulCompletion
      - obligation: PROJECTCLI-030
        invariant: NoDispatchAfterCancel
      - obligation: PROJECTCLI-030
        invariant: CompleteWhenContinuing
    conformance:
      - obligation: PROJECTCLI-030
        action: Finalize
        observation: states
        binding: project-check-keep-going
    faults:
      - id: last-result-wins
        source: models/project-checks/ModesLastWins.tla
        invariant: TruthfulCompletion
      - id: continue-after-stop
        source: models/project-checks/ModesAfterStop.tla
        invariant: NoDispatchAfterCancel
      - id: stop-early-in-keep-going
        source: models/project-checks/ModesEarly.tla
        invariant: CompleteWhenContinuing
  - id: pi-invocation
    component: foundation
    source: models/pi-invocation/Invocation.tla
    configuration: models/pi-invocation/Invocation.cfg
    modules: {}
    checker:
      backend: tla-ts
      version: 0.0.7
      timeout_seconds: 15
    bounds:
      max_states: 10000
      max_depth: 50
    assumptions:
      - One invocation represents validation, target resolution, dispatch and terminal reporting; independent concurrent calls do not share invocation state.
      - Stop abstracts host cancellation or absolute deadline observed before dispatch; cancellation during module execution is delegated to module ownership and tested with real processes.
      - A successful module outcome means successful selected operation, not project correctness; partial effects remain in the executable result, not modeled resource semantics.
    bindings:
      - obligation: FOUNDATION-004
        invariant: ValidatedDispatch
      - obligation: FOUNDATION-005
        invariant: NoDispatchAfterStop
      - obligation: FOUNDATION-006
        invariant: TruthfulResult
    conformance:
      - obligation: FOUNDATION-004
        action: Dispatch
        observation: dispatched
        binding: foundation.boundary
      - obligation: FOUNDATION-005
        action: Stop
        observation: stopped
        binding: foundation.lifecycle
      - obligation: FOUNDATION-006
        action: Report
        observation: success
        binding: foundation.results
    faults:
      - id: unvalidated-dispatch
        source: models/pi-invocation/InvocationUnvalidated.tla
        invariant: ValidatedDispatch
      - id: dispatch-after-stop
        source: models/pi-invocation/InvocationAfterStop.tla
        invariant: NoDispatchAfterStop
      - id: failed-result-success
        source: models/pi-invocation/InvocationFalseSuccess.tla
        invariant: TruthfulResult
  - id: gitlab-repository-read
    component: gitlab
    source: models/gitlab-read/Read.tla
    configuration: models/gitlab-read/Read.cfg
    modules: {}
    checker:
      backend: tla-ts
      version: 0.0.7
      timeout_seconds: 15
    bounds:
      max_states: 10000
      max_depth: 50
    assumptions:
      - One invocation with an allowed resolved host, a credential and at most two application read attempts; network-level packet retransmission is not modeled.
      - valid denotes complete JSON and matching project identity; byte limits, auth and schema parsing are established only by executable acceptance.
      - Stop abstracts cancellation or one absolute deadline. No liveness, remote API availability, pipeline mutation or arbitrary concurrent-client claim.
    bindings:
      - obligation: GITLAB-018
        invariant: BoundedReads
      - obligation: GITLAB-018
        invariant: HostBeforeRead
      - obligation: GITLAB-018
        invariant: NoStoppedDispatch
      - obligation: GITLAB-019
        invariant: TruthfulRead
    conformance:
      - obligation: GITLAB-018
        action: Send
        observation: sends
        binding: gitlab.transport-bounds
      - obligation: GITLAB-019
        action: Finish
        observation: success
        binding: gitlab.read-only
    faults:
      - id: third-read
        source: models/gitlab-read/ThirdRead.tla
        invariant: BoundedReads
      - id: missing-host
        source: models/gitlab-read/MissingHost.tla
        invariant: HostBeforeRead
      - id: after-stop
        source: models/gitlab-read/AfterStop.tla
        invariant: NoStoppedDispatch
      - id: invalid-success
        source: models/gitlab-read/InvalidSuccess.tla
        invariant: TruthfulRead
  - id: gitlab-mutations
    component: gitlab
    source: models/gitlab/Mutation.tla
    configuration: models/gitlab/Mutation.cfg
    modules: {}
    checker: &a1
      backend: tla-ts
      version: 0.0.7
      timeout_seconds: 20
    bounds:
      max_states: 50000
      max_depth: 50
    assumptions:
      - One selected project/pipeline and one other target represent target binding; one invocation and one write are bounded. This does not prove distributed locking or arbitrary concurrent clients.
      - valid and authorized are trusted host facts, not agent arguments. Authentication, URL parsing, credentials and endpoint construction require executable acceptance.
      - Stop abstracts cancellation/deadline observed before dispatch. Unknown POST completion cannot be deduced from a later unchanged pipeline status; no idempotency or exactly-once server processing is assumed.
      - jobsComplete and eligible abstract a complete current-job scan for retry and a known actionable/terminal observation for cancellation. Underlying GitLab state can race the observations.
      - Canceled observation is authoritative only for the exact selected pipeline. Request acceptance alone supplies no canceled observation. No liveness, eventual cancellation or green-pipeline claim.
    bindings:
      - obligation: GITLAB-007
        invariant: BoundTarget
      - obligation: GITLAB-008
        invariant: HonestConfirmation
      - obligation: GITLAB-009
        invariant: EvidenceForNoChange
      - obligation: GITLAB-012
        invariant: SingleSend
      - obligation: GITLAB-012
        invariant: HonestUnknown
      - obligation: GITLAB-013
        invariant: StopDispatch
      - obligation: GITLAB-014
        invariant: BoundTarget
    conformance:
      - action: Send
        binding: gitlab-007-acceptance
        obligation: GITLAB-007
        observation: sends
      - action: Confirm
        binding: gitlab-008-acceptance
        obligation: GITLAB-008
        observation: confirmed
      - action: NoChange
        binding: gitlab-009-acceptance
        obligation: GITLAB-009
        observation: outcome
      - action: Finalize
        binding: gitlab-012-acceptance
        obligation: GITLAB-012
        observation: outcome
      - action: Stop
        binding: gitlab-013-acceptance
        obligation: GITLAB-013
        observation: stopped
      - action: Send
        binding: gitlab-014-acceptance
        obligation: GITLAB-014
        observation: authorized
    faults:
      - id: wrong-target
        source: models/gitlab/WrongTarget.tla
        invariant: BoundTarget
      - id: duplicate-write
        source: models/gitlab/DuplicateWrite.tla
        invariant: SingleSend
      - id: after-stop
        source: models/gitlab/AfterStop.tla
        invariant: StopDispatch
      - id: lost-write-success
        source: models/gitlab/LostIsSuccess.tla
        invariant: HonestUnknown
      - id: acceptance-is-confirmation
        source: models/gitlab/AcceptedIsConfirmed.tla
        invariant: HonestConfirmation
      - id: partial-retry-noop
        source: models/gitlab/PartialNoChange.tla
        invariant: EvidenceForNoChange
  - id: gitlab-read-evidence
    component: gitlab
    source: models/gitlab/Reads.tla
    configuration: models/gitlab/Reads.cfg
    modules: {}
    checker: *a1
    bounds:
      max_states: 50000
      max_depth: 50
    assumptions:
      - Two pages represent complete versus partial collection evidence; additional pages require executable tests and do not follow from the finite model.
      - more=false means verified end-of-collection evidence from a well-formed bounded response; missing headers, malformed JSON or deadline exhaustion never supply that observation.
      - A scan is an observation across changing pages, not a transactional snapshot. Concurrent remote changes and private MR lookup filter correctness require executable acceptance.
    bindings:
      - obligation: GITLAB-002
        invariant: HonestAbsence
      - obligation: GITLAB-011
        invariant: HonestAbsence
    conformance:
      - action: Finish
        binding: gitlab-002-acceptance
        obligation: GITLAB-002
        observation: absent
      - action: Finish
        binding: gitlab-011-acceptance
        obligation: GITLAB-011
        observation: absent
    faults:
      - id: partial-absence
        source: models/gitlab/PartialAbsence.tla
        invariant: HonestAbsence
      - id: failure-absence
        source: models/gitlab/FailureAbsence.tla
        invariant: HonestAbsence
  - id: jira-duplicate-preflight
    component: jira-preflight
    source: models/jira/preflight/Preflight.tla
    configuration: models/jira/preflight/Preflight.cfg
    modules: {}
    checker:
      backend: tla-ts
      version: 0.0.7
      timeout_seconds: 15
    bounds:
      max_states: 10000
      max_depth: 50
    assumptions:
      - One invocation with one selected project. Clear denotes a complete scan without an exact match.
      - Change represents new evidence after confirmation. Remote visibility, normalization and races after the final observation require executable checks or remain outside this model.
    bindings:
      - obligation: JIRAPREFLIGHT-002
        invariant: CurrentDecision
      - obligation: JIRAPREFLIGHT-003
        invariant: CompleteBeforeSend
      - obligation: JIRAPREFLIGHT-005
        invariant: CurrentDecision
    conformance:
      - obligation: JIRAPREFLIGHT-002
        action: Send
        observation: sent
        binding: jirapreflight-002-acceptance
      - obligation: JIRAPREFLIGHT-003
        action: Scan
        observation: scan
        binding: jirapreflight-003-acceptance
      - obligation: JIRAPREFLIGHT-005
        action: Change
        observation: approval
        binding: jirapreflight-005-acceptance
