providers:
  llmgateway:
    baseUrl: https://api.llmgateway.io/v1
    api: openai-completions
    # env-var-name-or-literal: omp looks up an env var by this exact name first.
    # No `$` prefix - `$LLM_GATEWAY_KEY` would be sent as a literal bearer token.
    apiKey: LLM_GATEWAY_KEY
    authHeader: true
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: false
    models:
      - id: openai/gpt-6.2-astra
        name: GPT-6.2 Astra
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: xhigh
          requiresEffort: true
          effortMap:
            minimal: low
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 128000
        compat:
          supportsReasoningEffort: true
          reasoningEffortMap:
            minimal: low
        cost:
          input: 8.0
          output: 40.0
          cacheRead: 0.4
          cacheWrite: 10.0

      - id: openai/gpt-6.2-sol
        name: GPT-6.2 Sol
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: xhigh
          requiresEffort: true
          effortMap:
            minimal: low
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 128000
        compat:
          supportsReasoningEffort: true
          reasoningEffortMap:
            minimal: low
        cost:
          input: 2.0
          output: 10.0
          cacheRead: 0.1
          cacheWrite: 2.5

      - id: openai/gpt-6.1-terra
        name: GPT-6.1 Terra
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: xhigh
          requiresEffort: true
          effortMap:
            minimal: low
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 128000
        compat:
          supportsReasoningEffort: true
          reasoningEffortMap:
            minimal: low
        cost:
          input: 1.0
          output: 5.0
          cacheRead: 0.05
          cacheWrite: 1.25

      - id: openai/gpt-6-luna
        name: GPT-6 Luna
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: xhigh
          requiresEffort: true
          effortMap:
            minimal: low
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 128000
        compat:
          supportsReasoningEffort: true
          reasoningEffortMap:
            minimal: low
        cost:
          input: 0.1
          output: 0.5
          cacheRead: 0.01
          cacheWrite: 0.125

      - id: google-ai-studio/gemini-4-carbon
        name: Gemini 4 Carbon
        reasoning: true
        input: [text, image]
        contextWindow: 1048576
        # Gateway reports max_output equal to the context window for this route.
        maxTokens: 1048576
        compat:
          supportsReasoningEffort: true
          # /v1/models lists only "medium" and "high" for google-ai-studio/gemini-4-carbon.
          # Other tiers 400, so lower levels collapse to medium and higher levels to high.
          reasoningEffortMap:
            minimal: medium
            low: medium
            medium: medium
            high: high
            xhigh: high
            max: high
        cost:
          input: 4.0
          output: 20.0
          cacheRead: 0.2
          cacheWrite: 0.375

      - id: xai/grok-4-7
        name: Grok 4.7
        reasoning: true
        input: [text, image]
        contextWindow: 500000
        # The gateway reports no max_output for grok-4-7 on any route, so this is
        # a chosen cap, not a published limit.
        maxTokens: 131072
        compat:
          supportsReasoningEffort: true
          # xAI accepts low|medium|high|xhigh, not minimal or max.
          reasoningEffortMap:
            minimal: low
            max: xhigh
        cost:
          input: 2.0
          output: 6.0
          cacheRead: 0.5
          cacheWrite: 0

      - id: deepinfra/deepseek-v4.1-flash-1017
        name: DeepSeek V4.1 Flash 1017
        reasoning: true
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh, max]
          defaultLevel: high
          requiresEffort: true
          effortMap:
            minimal: minimal
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 393216
        compat:
          supportsReasoningEffort: true
          # DeepInfra accepts none|minimal|low|medium|high|xhigh|max.
          reasoningEffortMap:
            minimal: minimal
        cost:
          input: 0.2
          output: 0.6
          cacheRead: 0.006
          cacheWrite: 0

