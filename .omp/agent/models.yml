providers:
  llmgateway:
    baseUrl: https://api.llmgateway.io/v1
    api: openai-completions
    # env-var-name-or-literal: omp looks up an env var by this exact name first.
    # No `$` prefix - `$LLM_GATEWAY_KEY` would be sent as a literal bearer token.
    apiKey: LLM_GATEWAY_KEY
    authHeader: true
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: false
    models:
      - id: azure/gpt-5.6-sol
        name: GPT-5.6 Sol
        reasoning: true
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 128000
        compat:
          supportsReasoningEffort: true
        cost:
          input: 5.0
          output: 30.0
          cacheRead: 0.5
          cacheWrite: 6.25

      - id: azure/gpt-5.6-terra
        name: GPT-5.6 Terra
        reasoning: true
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 128000
        compat:
          supportsReasoningEffort: true
        cost:
          input: 2.0
          output: 12.0
          cacheRead: 0.2
          cacheWrite: 2.5

      - id: azure/gpt-5.6-luna
        name: GPT-5.6 Luna
        reasoning: true
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 128000
        compat:
          supportsReasoningEffort: true
        cost:
          input: 0.2
          output: 1.2
          cacheRead: 0.02
          cacheWrite: 0.25

      - id: google-vertex/gemini-3.7-flash
        name: Gemini 3.7 Flash
        reasoning: true
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 65536
        compat:
          supportsReasoningEffort: true
          # Vertex only accepts minimal|low|medium|high here - sending xhigh/max
          # makes it 400 with "thinking_budget is out of range".
          reasoningEffortMap:
            minimal: minimal
            low: low
            medium: medium
            high: high
            xhigh: high
            max: high
        cost:
          input: 0.75
          output: 3.75
          cacheRead: 0.075
          cacheWrite: 0.08333
