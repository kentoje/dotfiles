modelRoles: 
  smol: llmgateway/azure/gpt-5.6-luna:xhigh
  slow: llmgateway/azure/gpt-5.6-sol:xhigh
  plan: azure/gpt-5.6-sol:xhigh
  commit: azure/gpt-5.6-luna
  advisor: llmgateway/azure/gpt-5.6-terra:xhigh
  task: llmgateway/azure/gpt-5.6-luna:xhigh
  default: llmgateway/azure/gpt-5.6-terra:xhigh
symbolPreset: nerd
theme: 
  dark: melange_dark
  light: light
setupVersion: 2
dev: 
  autoqaConsent: denied
disabledProviders: 
  - claude
  - claude-plugins
  - cursor
  - codex
  - cline
  - gemini
  - github
  - mcp-json
  - opencode
  - vscode
  - windsurf
extensions: 
  - ~/Documents/github/kentoje/agent-gossips/src/extensions/omp-agent-gossips.ts
statusLine: 
  preset: custom
  separator: ascii
  transparent: true
  compactThinkingLevel: false
  showHookStatus: true
  sessionAccent: true
  leftSegments: 
    - pi
    - session
    - model
    - mode
    - cost
    - collab
    - path
    - git
    - context_pct
    - token_total
    - subagents
  rightSegments: 
    - session_name
    - token_rate
    - time_spent
  segmentOptions: 
    model: 
      showThinkingLevel: true
    path: 
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git: 
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
    time: 
      format: 24h
      showSeconds: false
advisor: 
  enabled: false
textVerbosity: low
task: 
  agentAdvisor: 
    task: "off"
  agentModelOverrides: 
    {}
terminal: 
  showProgress: true
tui: 
  tight: false
display: 
  showTokenUsage: true
defaultThinkingLevel: auto
prewalk: 
  enabled: false
composer: 
  shape: box